name: PZChessBot Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. JAVA
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 3. ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      # ---------------------------------------------------------
      # 4. INSTALL ANDROID PLATFORM + NDK
      # ---------------------------------------------------------
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          echo
          echo "Installed Android packages:"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed


      # ---------------------------------------------------------
      # 5. CONFIGURE NDK TOOLCHAIN
      # ---------------------------------------------------------
      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK directory does not exist:"
            echo "$NDK"
            exit 1
          fi

          if [ ! -x "$CXX" ]; then
            echo "ERROR: Android ARM64 compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo
          echo "Compiler:"
          "$CXX" --version

          echo
          echo "Target:"
          "$CXX" -dumpmachine


      # ---------------------------------------------------------
      # 6. DOWNLOAD NNUE
      # ---------------------------------------------------------
      - name: Download NNUE
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/kevlu8/PZChessBot-Networks/releases/latest/download/nnue.bin" \
            -o nnue.bin

          if [ ! -s nnue.bin ]; then
            echo "ERROR: nnue.bin is missing or empty."
            exit 1
          fi

          echo
          echo "NNUE:"
          ls -lh nnue.bin


      # ---------------------------------------------------------
      # 7. VERIFY PZCHESSBOT ARM SOURCE
      # ---------------------------------------------------------
      - name: Verify PZChessBot ARM source
        shell: bash
        run: |
          set -e

          test -f engine/arch/arch.hpp
          test -f engine/arch/aarch64.hpp
          test -f engine/arch/simd/neon.hpp
          test -f engine/arch/simd/simd.cpp

          echo "ARM/NEON implementation found."


      # ---------------------------------------------------------
      # 8. VERIFY ARM64 NEON COMPILER
      # ---------------------------------------------------------
      - name: Verify ARM64 NEON compiler
        shell: bash
        run: |
          set -e

          cat > /tmp/arm_test.cpp <<'EOF'
          #include <arm_neon.h>

          #ifndef __aarch64__
          #error "__aarch64__ is not defined"
          #endif

          #ifndef __ARM_NEON
          #error "__ARM_NEON is not defined"
          #endif

          int main() {
              int32x4_t x = vdupq_n_s32(1);
              x = vaddq_s32(x, x);

              return vgetq_lane_s32(x, 0) == 2 ? 0 : 1;
          }
          EOF

          "$CXX" \
            -std=c++20 \
            -march=armv8-a+simd \
            /tmp/arm_test.cpp \
            -o /tmp/arm_test

          echo
          echo "Test binary:"
          file /tmp/arm_test

          echo
          echo "ARM64 NEON compiler test PASSED."


      # ---------------------------------------------------------
      # 9. PATCH LINUX-ONLY PTHREAD CODE FOR ANDROID
      # ---------------------------------------------------------
      - name: Patch pthread code for Android
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/threads.cpp")
          text = path.read_text()

          old = "pthread_setattr_default_np(&attr);"

          if old not in text:
              raise SystemExit(
                  "ERROR: pthread_setattr_default_np() was not found "
                  "in engine/threads.cpp"
              )

          replacement = """#ifndef __ANDROID__
              pthread_setattr_default_np(&attr);
          #endif"""

          text = text.replace(old, replacement, 1)

          path.write_text(text)
          PY

          echo
          echo "Android pthread patch applied."

          echo
          echo "Patched code:"
          grep -n -A10 -B6 \
            "pthread_setattr_default_np" \
            engine/threads.cpp


      # ---------------------------------------------------------
      # 10. CLEAN BUILD
      # ---------------------------------------------------------
      - name: Clean build
        shell: bash
        run: |
          set -e

          rm -rf build
          rm -f pzchessbot

          mkdir -p build
          mkdir -p build/logs


      # ---------------------------------------------------------
      # 11. COMPILE
      # ---------------------------------------------------------
      - name: Compile PZChessBot
        shell: bash
        run: |
          set -e
          set -o pipefail

          SOURCES=(
            engine/arch/arch.cpp
            engine/arch/simd/simd.cpp
            engine/bitboard.cpp
            engine/eval.cpp
            engine/history.cpp
            engine/main.cpp
            engine/movegen.cpp
            engine/movepicker.cpp
            engine/nnue/accumulator.cpp
            engine/nnue/network.cpp
            engine/nnue/threats.cpp
            engine/params.cpp
            engine/search.cpp
            engine/tb.cpp
            engine/threads.cpp
            engine/ttable.cpp
            Pyrrhic/tbprobe.cpp
          )

          COMMON_FLAGS=(
            -std=c++20
            -O3
            -march=armv8-a+simd
            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections

            -D__ANDROID__
            -DNNUE_PATH=\"nnue.bin\"
            -DVERSION=\"android-arm64-neon\"

            -Iengine
            -IPyrrhic

            -MMD
            -MP
          )

          for SRC in "${SOURCES[@]}"; do

            OBJ="build/$(echo "$SRC" | sed 's#/#_#g; s#\.cpp$#.o#')"

            LOG="build/logs/$(echo "$SRC" | sed 's#/#_#g; s#\.cpp$#.log#')"

            echo
            echo "----------------------------------------"
            echo "COMPILING:"
            echo "$SRC"
            echo "----------------------------------------"

            if ! "$CXX" \
              "${COMMON_FLAGS[@]}" \
              -c "$SRC" \
              -o "$OBJ" \
              2>&1 | tee "$LOG"
            then
              echo
              echo "========================================"
              echo "COMPILATION FAILED:"
              echo "$SRC"
              echo "========================================"

              echo
              echo "Compiler log:"
              cat "$LOG"

              exit 1
            fi

            echo
            echo "OK: $SRC"

          done


      # ---------------------------------------------------------
      # 12. LINK
      # ---------------------------------------------------------
      - name: Link Android ARM64 binary
        shell: bash
        run: |
          set -e

          echo "Linking PZChessBot..."

          "$CXX" \
            -O3 \
            -march=armv8-a+simd \
            -fomit-frame-pointer \
            -Wl,--gc-sections \
            -static-libstdc++ \
            build/*.o \
            -o pzchessbot

          chmod +x pzchessbot

          echo
          echo "Binary:"
          ls -lh pzchessbot


      # ---------------------------------------------------------
      # 13. VERIFY ELF
      # ---------------------------------------------------------
      - name: Verify Android ARM64 binary
        shell: bash
        run: |
          set -e

          echo "File information:"
          file pzchessbot

          echo
          echo "ELF header:"
          readelf -h pzchessbot | \
            grep -E "Class:|Data:|Type:|Machine:"

          echo
          echo "Checking ARM64..."

          if ! file pzchessbot | grep -Eiq "aarch64|arm64"; then
            echo "ERROR: Binary is not ARM64."
            exit 1
          fi

          echo
          echo "ARM64 ELF verification PASSED."


      # ---------------------------------------------------------
      # 14. PACKAGE
      # ---------------------------------------------------------
      - name: Package Android engine
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp pzchessbot release/
          cp nnue.bin release/

          cat > release/README.txt <<'EOF'
          PZChessBot Android ARM64 NEON

          Architecture:
            ARM64 / AArch64

          SIMD:
            ARM NEON

          Android minimum API:
            24

          Build:
            Android NDK 27.2.12479018

          Target:
            armv8-a + NEON

          Files:
            pzchessbot
            nnue.bin

          IMPORTANT:
            Keep nnue.bin in the same directory as
            the pzchessbot executable.
          EOF

          chmod +x release/pzchessbot

          tar -czf \
            PZChessBot-Android-ARM64-NEON.tar.gz \
            -C release \
            pzchessbot \
            nnue.bin \
            README.txt

          echo
          echo "Package:"
          ls -lh PZChessBot-Android-ARM64-NEON.tar.gz


      # ---------------------------------------------------------
      # 15. UPLOAD ARTIFACT
      # ---------------------------------------------------------
      - name: Upload Android ARM64 NEON build
        uses: actions/upload-artifact@v4
        with:
          name: PZChessBot-Android-ARM64-NEON
          path: |
            PZChessBot-Android-ARM64-NEON.tar.gz
            release/pzchessbot
            release/nnue.bin
            build/logs/*.log
          if-no-files-found: error
