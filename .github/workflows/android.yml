name: PZChessBot Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

      # ---------------------------------------------------------
      # Configure compiler
      # ---------------------------------------------------------
      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CXX="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++"

          test -x "$CXX"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "========================================"
          echo "Android NDK:"
          echo "$NDK"
          echo
          echo "Compiler:"
          "$CXX" --version
          echo
          echo "Target:"
          "$CXX" -dumpmachine
          echo "========================================"

      # ---------------------------------------------------------
      # Download NNUE
      # ---------------------------------------------------------
      - name: Download NNUE
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://github.com/kevlu8/PZChessBot-Networks/releases/latest/download/nnue.bin" \
            -o nnue.bin

          test -s nnue.bin

          echo "NNUE:"
          ls -lh nnue.bin

      # ---------------------------------------------------------
      # Check ARM source
      # ---------------------------------------------------------
      - name: Check ARM NEON source
        run: |
          set -e

          test -f engine/arch/arch.hpp
          test -f engine/arch/aarch64.hpp
          test -f engine/arch/simd/simd.hpp
          test -f engine/arch/simd/neon.hpp
          test -f engine/arch/simd/simd.cpp

          echo "ARM/NEON implementation found."

      # ---------------------------------------------------------
      # Verify compiler selects ARM NEON
      # ---------------------------------------------------------
      - name: Verify ARM NEON compiler macros
        shell: bash
        run: |
          set -e

          cat > /tmp/arm_test.cpp <<'EOF'
          #include <arm_neon.h>

          #ifndef __aarch64__
          #error "__aarch64__ is not defined"
          #endif

          #ifndef __ARM_NEON
          #error "__ARM_NEON is not defined"
          #endif

          int main() {
              int32x4_t x = vdupq_n_s32(1);
              x = vaddq_s32(x, x);
              return vgetq_lane_s32(vget_low_s32(x), 0) == 2 ? 0 : 1;
          }
          EOF

          "$CXX" \
            -std=c++20 \
            -march=armv8-a+simd \
            /tmp/arm_test.cpp \
            -o /tmp/arm_test

          file /tmp/arm_test

          echo "ARM64 NEON compiler test passed."

      # ---------------------------------------------------------
      # Clean previous objects
      # ---------------------------------------------------------
      - name: Clean
        run: |
          rm -f pzchessbot

          find engine -name "*.o" -delete
          find engine -name "*.d" -delete

      # ---------------------------------------------------------
      # Compile each source separately
      #
      # This is intentional.
      #
      # If one source fails, GitHub will show EXACTLY which
      # source file caused the failure instead of hiding it
      # inside one giant compiler command.
      # ---------------------------------------------------------
      - name: Compile source files
        shell: bash
        run: |
          set -e

          mkdir -p build

          SOURCES=(
            engine/arch/arch.cpp
            engine/arch/simd/simd.cpp
            engine/bitboard.cpp
            engine/eval.cpp
            engine/history.cpp
            engine/main.cpp
            engine/movegen.cpp
            engine/movepicker.cpp
            engine/nnue/accumulator.cpp
            engine/nnue/network.cpp
            engine/nnue/threats.cpp
            engine/params.cpp
            engine/search.cpp
            engine/tb.cpp
            engine/threads.cpp
            engine/ttable.cpp
            Pyrrhic/tbprobe.cpp
          )

          COMMON_FLAGS=(
            -std=c++20
            -O3

            -march=armv8-a+simd

            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections

            -DNNUE_PATH=\"nnue.bin\"
            -DVERSION=\"android-arm64-neon\"

            -Iengine
            -IPyrrhic

            -MMD
            -MP
          )

          for SRC in "${SOURCES[@]}"; do
            OBJ="build/$(echo "$SRC" | sed 's#/#_#g; s#\.cpp$#.o#')"

            echo
            echo "========================================"
            echo "COMPILING:"
            echo "$SRC"
            echo "========================================"

            "$CXX" \
              "${COMMON_FLAGS[@]}" \
              -c "$SRC" \
              -o "$OBJ"

            echo "OK: $SRC"
          done

      # ---------------------------------------------------------
      # Link
      # ---------------------------------------------------------
      - name: Link Android binary
        shell: bash
        run: |
          set -e

          echo "Linking..."

          "$CXX" \
            -O3 \
            -march=armv8-a+simd \
            -fomit-frame-pointer \
            -Wl,--gc-sections \
            -Wl,-z,stack-size=8388608 \
            -static-libstdc++ \
            build/*.o \
            -o pzchessbot

          chmod +x pzchessbot

          echo
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh pzchessbot

      # ---------------------------------------------------------
      # ELF verification
      # ---------------------------------------------------------
      - name: Verify binary
        shell: bash
        run: |
          set -e

          echo "FILE:"
          file pzchessbot

          echo
          echo "ELF HEADER:"
          readelf -h pzchessbot | grep -E \
            "Class:|Data:|Type:|Machine:"

          echo
          echo "DYNAMIC SECTION:"
          readelf -d pzchessbot || true

          echo
          echo "NEON instructions:"
          readelf -A pzchessbot 2>/dev/null || true

          echo
          echo "Checking architecture..."

          file pzchessbot | grep -Ei \
            "aarch64|arm64"

          echo
          echo "Android ARM64 verification passed."

      # ---------------------------------------------------------
      # Package
      # ---------------------------------------------------------
      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp pzchessbot release/
          cp nnue.bin release/

          cat > release/README.txt <<'EOF'
          PZChessBot Android ARM64 NEON

          Architecture:
            ARM64 / AArch64

          SIMD:
            ARM NEON

          Android API:
            24+

          Files:
            pzchessbot
            nnue.bin

          Keep nnue.bin beside the executable.
          EOF

          tar -czf \
            PZChessBot-Android-ARM64-NEON.tar.gz \
            -C release \
            pzchessbot \
            nnue.bin \
            README.txt

          ls -lh \
            PZChessBot-Android-ARM64-NEON.tar.gz \
            release/pzchessbot \
            release/nnue.bin

      # ---------------------------------------------------------
      # Upload
      # ---------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PZChessBot-Android-ARM64-NEON
          path: |
            PZChessBot-Android-ARM64-NEON.tar.gz
            release/pzchessbot
            release/nnue.bin
          if-no-files-found: error
