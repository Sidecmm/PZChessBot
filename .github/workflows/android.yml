name: PZChessBot Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:
      # =========================================================
      # SOURCE
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # JAVA
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # =========================================================
      # INSTALL ANDROID NDK
      # =========================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

          echo
          echo "Installing required Android packages..."

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          echo
          echo "Installed packages:"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      # =========================================================
      # CONFIGURE NDK TOOLCHAIN
      # =========================================================
      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK directory does not exist:"
            echo "$NDK"
            exit 1
          fi

          if [ ! -x "$CXX" ]; then
            echo "ERROR: Android ARM64 compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          echo "$NDK"

          echo
          echo "========================================"
          echo "COMPILER"
          echo "========================================"
          "$CXX" --version

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"
          "$CXX" -dumpmachine

      # =========================================================
      # DOWNLOAD NNUE
      # =========================================================
      - name: Download NNUE
        shell: bash
        run: |
          set -e

          echo "Downloading NNUE..."

          curl -fL \
            "https://github.com/kevlu8/PZChessBot-Networks/releases/latest/download/nnue.bin" \
            -o nnue.bin

          if [ ! -s nnue.bin ]; then
            echo "ERROR: nnue.bin is missing or empty."
            exit 1
          fi

          echo
          echo "NNUE downloaded:"
          ls -lh nnue.bin

      # =========================================================
      # CHECK PZCHESSBOT ARM SOURCE
      # =========================================================
      - name: Verify PZChessBot ARM source
        shell: bash
        run: |
          set -e

          echo "Checking ARM/NEON source files..."

          test -f engine/arch/arch.hpp
          test -f engine/arch/aarch64.hpp
          test -f engine/arch/simd/neon.hpp
          test -f engine/arch/simd/simd.cpp

          echo
          echo "ARM/NEON implementation found."

          echo
          echo "Architecture files:"
          ls -lh \
            engine/arch/arch.hpp \
            engine/arch/aarch64.hpp \
            engine/arch/simd/neon.hpp \
            engine/arch/simd/simd.cpp

      # =========================================================
      # VERIFY ARM64 + NEON COMPILER
      # =========================================================
      #
      # IMPORTANT:
      # This test intentionally uses vgetq_lane_s32(x, 0).
      #
      # vget_low_s32(x) returns int32x2_t and therefore must NOT
      # be passed to vgetq_lane_s32(), which expects int32x4_t.
      #
      # =========================================================
      - name: Verify ARM64 NEON compiler
        shell: bash
        run: |
          set -e

          cat > /tmp/arm_test.cpp <<'EOF'
          #include <arm_neon.h>

          #ifndef __aarch64__
          #error "__aarch64__ is not defined"
          #endif

          #ifndef __ARM_NEON
          #error "__ARM_NEON is not defined"
          #endif

          int main() {
              int32x4_t x = vdupq_n_s32(1);
              x = vaddq_s32(x, x);

              return vgetq_lane_s32(x, 0) == 2 ? 0 : 1;
          }
          EOF

          echo "Compiling ARM64 NEON test..."

          "$CXX" \
            -std=c++20 \
            -march=armv8-a+simd \
            /tmp/arm_test.cpp \
            -o /tmp/arm_test

          echo
          echo "ARM test binary:"
          file /tmp/arm_test

          echo
          echo "ARM64 NEON compiler test PASSED."

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean build
        shell: bash
        run: |
          set -e

          rm -rf build
          rm -f pzchessbot

          mkdir -p build

      # =========================================================
      # COMPILE PZCHESSBOT
      #
      # Each source is compiled separately.
      #
      # This makes compiler errors easy to identify.
      # =========================================================
      - name: Compile PZChessBot
        shell: bash
        run: |
          set -e

          SOURCES=(
            engine/arch/arch.cpp
            engine/arch/simd/simd.cpp
            engine/bitboard.cpp
            engine/eval.cpp
            engine/history.cpp
            engine/main.cpp
            engine/movegen.cpp
            engine/movepicker.cpp
            engine/nnue/accumulator.cpp
            engine/nnue/network.cpp
            engine/nnue/threats.cpp
            engine/params.cpp
            engine/search.cpp
            engine/tb.cpp
            engine/threads.cpp
            engine/ttable.cpp
            Pyrrhic/tbprobe.cpp
          )

          COMMON_FLAGS=(
            -std=c++20
            -O3

            # ARM64 + standard ARMv8 NEON
            -march=armv8-a+simd

            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections

            -DNNUE_PATH=\"nnue.bin\"
            -DVERSION=\"android-arm64-neon\"

            -Iengine
            -IPyrrhic

            -MMD
            -MP
          )

          echo
          echo "========================================"
          echo "PZCHESSBOT COMPILATION"
          echo "========================================"

          for SRC in "${SOURCES[@]}"; do

            OBJ="build/$(echo "$SRC" | sed 's#/#_#g; s#\.cpp$#.o#')"

            echo
            echo "----------------------------------------"
            echo "COMPILING:"
            echo "$SRC"
            echo "----------------------------------------"

            "$CXX" \
              "${COMMON_FLAGS[@]}" \
              -c "$SRC" \
              -o "$OBJ"

            echo "OK: $SRC"

          done

          echo
          echo "========================================"
          echo "ALL SOURCE FILES COMPILED"
          echo "========================================"

          echo
          echo "Object files:"
          ls -lh build/

      # =========================================================
      # LINK
      # =========================================================
      - name: Link Android ARM64 binary
        shell: bash
        run: |
          set -e

          echo "Linking PZChessBot..."

          "$CXX" \
            -O3 \
            -march=armv8-a+simd \
            -fomit-frame-pointer \
            -Wl,--gc-sections \
            -static-libstdc++ \
            build/*.o \
            -o pzchessbot

          chmod +x pzchessbot

          echo
          echo "========================================"
          echo "LINK SUCCESSFUL"
          echo "========================================"

          ls -lh pzchessbot

      # =========================================================
      # VERIFY ELF
      # =========================================================
      - name: Verify Android ARM64 binary
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "FILE"
          echo "========================================"

          file pzchessbot

          echo
          echo "========================================"
          echo "ELF HEADER"
          echo "========================================"

          readelf -h pzchessbot | grep -E \
            "Class:|Data:|Type:|Machine:"

          echo
          echo "========================================"
          echo "ARCHITECTURE CHECK"
          echo "========================================"

          if ! file pzchessbot | grep -Eiq "aarch64|arm64"; then
            echo "ERROR: Binary is not ARM64."
            exit 1
          fi

          echo
          echo "ARM64 ELF verification PASSED."

      # =========================================================
      # PACKAGE
      # =========================================================
      - name: Package Android engine
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp pzchessbot release/
          cp nnue.bin release/

          cat > release/README.txt <<'EOF'
          PZChessBot Android ARM64 NEON

          Architecture:
            ARM64 / AArch64

          SIMD:
            ARM NEON

          Android minimum API:
            24

          Files:
            pzchessbot
            nnue.bin

          IMPORTANT:
            Keep nnue.bin in the same directory as
            the pzchessbot executable.

          Build:
            Android NDK 27.2.12479018

          Target:
            armv8-a + NEON
          EOF

          chmod +x release/pzchessbot

          tar -czf \
            PZChessBot-Android-ARM64-NEON.tar.gz \
            -C release \
            pzchessbot \
            nnue.bin \
            README.txt

          echo
          echo "========================================"
          echo "PACKAGE CREATED"
          echo "========================================"

          ls -lh \
            PZChessBot-Android-ARM64-NEON.tar.gz \
            release/pzchessbot \
            release/nnue.bin

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload Android ARM64 NEON build
        uses: actions/upload-artifact@v4
        with:
          name: PZChessBot-Android-ARM64-NEON
          path: |
            PZChessBot-Android-ARM64-NEON.tar.gz
            release/pzchessbot
            release/nnue.bin
          if-no-files-found: error
